name: Phase 1 Android build check

on:
  push:
    branches:
      - phase1/local-workspace-config

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JW-Task-Scheduler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release notes and tag
        id: release
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          TAG="v${VERSION}-test.${GITHUB_RUN_NUMBER}"
          awk -v version="$VERSION" '$0 == "## " version {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          printf '\n- Test build fixes the shared workspace API endpoint used at sign-in.\n' >> release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: JW Task Scheduler ${{ steps.release.outputs.version }} Test Build ${{ github.run_number }}
          body_path: release-notes.md
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
