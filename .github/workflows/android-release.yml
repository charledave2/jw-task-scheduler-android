name: Build and release Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK and source archive
        id: build
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          gradle --no-daemon :app:assembleDebug
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/jw-task-scheduler-$VERSION_NAME.apk"
          zip -qr "release-assets/jw-task-scheduler-android-source-$VERSION_NAME.zip" . -x './.git/*' './app/build/*' './release-assets/*'
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_OUTPUT"
          cat > release-assets/notes.md <<NOTES
          ## JW Task Scheduler $VERSION_NAME
          - Android version code: $VERSION_CODE
          - Source archive contains the Android project only.
          - See CHANGELOG.md for feature details.
          NOTES
      - name: Verify update signing certificate matches the latest release
        run: |
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          RELEASE_JSON=$(mktemp)
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/charledave2/jw-task-scheduler-android/releases/latest \
            --output "$RELEASE_JSON"
          PREVIOUS_APK=$(jq -r '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url // empty' "$RELEASE_JSON")
          test -n "$PREVIOUS_APK" || { echo "Could not find the current release APK to compare signing certificates."; exit 1; }
          curl --fail --silent --show-error --location "$PREVIOUS_APK" --output previous-release.apk
          CURRENT_APK=app/build/outputs/apk/debug/app-debug.apk
          PREVIOUS_CERT=$("$APK_SIGNER" verify --print-certs previous-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]')
          CURRENT_CERT=$("$APK_SIGNER" verify --print-certs "$CURRENT_APK" | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]')
          test -n "$PREVIOUS_CERT" && test -n "$CURRENT_CERT"
          if [ "$PREVIOUS_CERT" != "$CURRENT_CERT" ]; then
            echo "Signing certificate changed. This APK cannot update the currently released app, so no release will be published."
            echo "Configure the existing app signing key in GitHub Actions before building an in-app update."
            exit 1
          fi
          echo "Signing certificate matches the current release."
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.build.outputs.VERSION_NAME }}"
          "release-assets/jw-task-scheduler-${{ steps.build.outputs.VERSION_NAME }}.apk"
          "release-assets/jw-task-scheduler-android-source-${{ steps.build.outputs.VERSION_NAME }}.zip"
          --repo "$GITHUB_REPOSITORY"
          --title "JW Task Scheduler ${{ steps.build.outputs.VERSION_NAME }}"
          --notes-file release-assets/notes.md
